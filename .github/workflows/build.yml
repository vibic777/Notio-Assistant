name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Accept SDK licences and install the platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit and UI tests (JVM, Robolectric) and a debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests of the desktop app and its shared module
        run: ./gradlew --no-daemon :desktopApp:checkAndroidStrings :windowsShared:jvmTest :desktopApp:jvmTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-reports
          path: |
            windows/shared/build/reports/tests
            windows/desktopApp/build/reports/tests

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev xvfb
      - name: Tests of the desktop app on Linux
        run: xvfb-run -a ./gradlew --no-daemon :windowsShared:jvmTest :desktopApp:jvmTest
      - name: The .deb and the portable archive
        run: xvfb-run -a ./gradlew --no-daemon :desktopApp:releaseLinux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-builds
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.bin
            dist/*.AppImage
            windows/desktopApp/build/reports/tests
